<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Guard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #0b1220;
            color: #e5e7eb;
        }

        body {
            overflow: hidden;
        }

        .header {
            height: 68px;
            padding: 12px 20px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #f9fafb;
        }

        .header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #94a3b8;
        }

        .dashboard {
            height: calc(100vh - 68px);
            padding: 10px 12px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 380px;
            gap: 12px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            min-height: 0;
        }

        .card-title {
            margin: 0;
            padding: 14px 16px 0 16px;
            font-size: 18px;
            color: #f3f4f6;
        }

        /* 왼쪽 영상 */
        .video-card {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0 16px 16px 16px;
        }

        .video-wrap {
            flex: 1;
            min-height: 0;
            margin-top: 12px;
            background: #000;
            border: 2px solid #374151;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 핵심 수정: 최대한 크게 보여주되 안 자름 */
        .video-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background: #000;
        }

        /* 오른쪽 패널 */
        .right-panel {
            display: grid;
            grid-template-rows: 160px auto 1fr;
            gap: 12px;
            min-height: 0;
        }

        /* 경보 카드 */
        .alert-card {
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .alert-card.normal {
            background: linear-gradient(135deg, #065f46, #047857);
            border-color: #10b981;
        }

        .alert-card.danger {
            background: linear-gradient(135deg, #991b1b, #dc2626);
            border-color: #ef4444;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25), 0 0 30px rgba(220, 38, 38, 0.35);
        }

        .alert-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .alert-label {
            font-size: 15px;
            font-weight: 700;
            opacity: 0.95;
        }

        .alert-chip {
            min-width: 68px;
            text-align: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .alert-main {
            font-size: 36px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .alert-detail {
            font-size: 16px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.92);
            font-weight: 600;
            word-break: keep-all;
        }

        .alert-card.danger .alert-main {
            font-size: 40px;
        }

        /* 감지 현황 */
        .status-card {
            padding: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .stat-box {
            background: #1f2937;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .stat-title {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 시스템 정보 */
        .info-card {
            padding: 14px;
            min-height: 0;
        }

        .info-list {
            margin-top: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid #243041;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #94a3b8;
        }

        .info-value {
            color: #f8fafc;
            text-align: right;
            font-weight: 700;
        }

        .camera-online {
            color: #22c55e;
        }

        .camera-offline {
            color: #ef4444;
        }

        @media (max-width: 1200px) {
            body {
                overflow: auto;
            }

            .dashboard {
                height: auto;
                grid-template-columns: 1fr;
            }

            .right-panel {
                grid-template-rows: auto auto auto;
            }

            .video-wrap {
                height: min(62vh, 700px);
            }

            .alert-main {
                font-size: 32px;
            }

            .alert-card.danger .alert-main {
                font-size: 36px;
            }
        }

        @media (max-width: 700px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .alert-main {
                font-size: 28px;
            }

            .alert-card.danger .alert-main {
                font-size: 32px;
            }

            .alert-detail {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Vision Guard - 경비 시스템</h1>
        <p>실시간 감시 영상 및 감지 현황 모니터링</p>
    </div>

    <div class="dashboard">
        <!-- 왼쪽: 영상 -->
        <div class="card video-card">
            <h2 class="card-title">실시간 카메라 영상</h2>
            <div class="video-wrap">
                <img src="{{ url_for('video_feed') }}" alt="카메라 영상">
            </div>
        </div>

        <!-- 오른쪽: 경보 / 감지 현황 / 시스템 정보 -->
        <div class="right-panel">
            <div id="alertCard" class="card alert-card normal">
                <div class="alert-top">
                    <div class="alert-label">현재 상태</div>
                    <div id="alertChip" class="alert-chip">정상</div>
                </div>
                <div id="alertMain" class="alert-main">이상 상황 없음</div>
                <div id="alertDetail" class="alert-detail">실시간 감시 중입니다.</div>
            </div>

            <div class="card status-card">
                <h2 class="card-title" style="padding:0; margin-bottom: 8px;">감지 현황</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-title">사람</div>
                        <div class="stat-value" id="personCount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-title">쓰러짐</div>
                        <div class="stat-value" id="falldownCount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-title">폭행</div>
                        <div class="stat-value" id="attackCount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-title">흡연</div>
                        <div class="stat-value" id="smokingCount">0</div>
                    </div>
                </div>
            </div>

            <div class="card info-card">
                <h2 class="card-title" style="padding:0; margin-bottom: 8px;">시스템 정보</h2>
                <div class="info-list">
                    <div class="info-row">
                        <div class="info-label">카메라 상태</div>
                        <div id="cameraState" class="info-value camera-offline">연결 안됨</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">마지막 프레임 수신</div>
                        <div id="lastFrameTime" class="info-value">-</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">마지막 상황 데이터 수신</div>
                        <div id="lastCommandTime" class="info-value">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                document.getElementById('personCount').textContent = data.classes.person ?? 0;
                document.getElementById('falldownCount').textContent = data.classes.falldown ?? 0;
                document.getElementById('attackCount').textContent = data.classes.attack ?? 0;
                document.getElementById('smokingCount').textContent = data.classes.smoking ?? 0;

                document.getElementById('lastFrameTime').textContent = data.last_frame_time || "-";
                document.getElementById('lastCommandTime').textContent = data.last_command_time || "-";

                const cameraState = document.getElementById('cameraState');
                if (data.camera_online) {
                    cameraState.textContent = "연결됨";
                    cameraState.className = "info-value camera-online";
                } else {
                    cameraState.textContent = "연결 안됨";
                    cameraState.className = "info-value camera-offline";
                }

                const alertCard = document.getElementById('alertCard');
                const alertChip = document.getElementById('alertChip');
                const alertMain = document.getElementById('alertMain');
                const alertDetail = document.getElementById('alertDetail');

                if (data.active_alerts && data.active_alerts.length > 0) {
                    alertCard.className = "card alert-card danger";
                    alertChip.textContent = "경보";
                    alertMain.textContent = "이상 상황 감지";
                    alertDetail.textContent = data.active_alerts.join(" / ");
                } else {
                    alertCard.className = "card alert-card normal";
                    alertChip.textContent = "정상";
                    alertMain.textContent = "이상 상황 없음";
                    alertDetail.textContent = "실시간 감시 중입니다.";
                }

            } catch (error) {
                console.error("상태 조회 실패:", error);
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 1000);
    </script>
</body>
</html>
